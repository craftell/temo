name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: go mod tidy
      - name: Check formatting and module lockfiles
        run: |
          gofmt -d *.go
          test -z "$(gofmt -l *.go)"
          git diff --exit-code -- go.mod go.sum
      - name: Parse verification helpers without running them
        run: python3 -m py_compile .cursor/skills/verify-temo/verify*.py
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o temo .
      - name: Real PTY keyboard smoke (no network backends)
        if: runner.os == 'Linux'
        run: |
          evidence="$RUNNER_TEMP/temo-keyboard-evidence"
          if ! python3 .cursor/skills/verify-temo/verify-keyboard.py --binary ./temo --evidence "$evidence"; then
            cat "$evidence"/*FAILED*.txt "$evidence"/backend.jsonl 2>/dev/null || true
            exit 1
          fi
          cat "$evidence/result.txt" "$evidence/actions.log" "$evidence/cancellation.json"
          cat "$evidence"/*-list-ssh-bravo.txt "$evidence"/*-down-field.txt
      - name: Real PTY modal and deletion smoke (disposable config)
        if: runner.os == 'Linux'
        run: |
          evidence="$RUNNER_TEMP/temo-modal-evidence"
          python3 .cursor/skills/verify-temo/verify-modal.py --binary ./temo --evidence "$evidence"
          cat "$evidence/result.txt"
      - name: Real PTY alternative definitions smoke (no backends)
        if: runner.os == 'Linux'
        run: |
          evidence="$RUNNER_TEMP/temo-definitions-evidence"
          python3 .cursor/skills/verify-temo/verify-definitions.py --binary ./temo --evidence "$evidence"
          cat "$evidence/result.txt"
      - name: Save alternative definitions evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: definitions-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/temo-definitions-evidence
          if-no-files-found: warn
      - name: Save modal smoke evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: modal-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/temo-modal-evidence
          if-no-files-found: warn
      - name: Save keyboard smoke evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/temo-keyboard-evidence
          if-no-files-found: warn
      - name: Save resolved dependencies
        uses: actions/upload-artifact@v4
        with:
          name: modules-${{ matrix.os }}
          path: |
            go.mod
            go.sum
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: go mod tidy
      - run: |
          GOOS=darwin GOARCH=arm64 go build -o temo-darwin-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o temo-darwin-amd64 .
          GOOS=linux GOARCH=amd64 go build -o temo-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o temo-linux-arm64 .
