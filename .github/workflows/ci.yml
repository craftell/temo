name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: go mod tidy
      - name: Record normalized source and module checksums
        run: |
          gofmt -w *.go
          python3 - <<'PY'
          import glob, json
          paths = sorted(glob.glob("*.go") + ["go.mod", "go.sum"])
          for p in paths:
              print("TEMO_NORMALIZED_FILE=" + json.dumps({"path": p, "content": open(p).read()}))
          PY
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o temo .
      - name: Save resolved dependencies
        uses: actions/upload-artifact@v4
        with:
          name: modules-${{ matrix.os }}
          path: |
            go.mod
            go.sum
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: go mod tidy
      - run: |
          GOOS=darwin GOARCH=arm64 go build -o temo-darwin-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o temo-darwin-amd64 .
          GOOS=linux GOARCH=amd64 go build -o temo-linux-amd64 .
